name: Test

on:
  push:
    branches: master

jobs:
  forge-tests:
    runs-on: ubuntu-latest

    steps:

      - name: Monitor network egress
        uses: bullfrogsec/bullfrog@6ad91f116342abf94e4d02c6d05260cacf717bd0
        
      - uses: actions/checkout@v7

      - name: Foundry Toolchain
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build
        run: forge build

      - name: Run Tests
        run: forge test --isolate -vvv
        env:
          FORGE_SNAPSHOT_CHECK: true
