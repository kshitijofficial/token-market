name: Lint

on:
  push:
    branches: master

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Monitor network egress
        uses: bullfrogsec/bullfrog@6ad91f116342abf94e4d02c6d05260cacf717bd0

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Solidity Formatting
        run: forge fmt --check
